name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "❌ Secret SUPABASE_URL belum diisi."
            exit 1
          fi

          if [ -z "${SUPABASE_KEY:-}" ]; then
            echo "❌ Secret SUPABASE_PUBLISHABLE_KEY belum diisi."
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"

          echo "Menghubungi Supabase..."

          STATUS="$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            --output response.json \
            --write-out "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/studies?select=id&limit=1")"

          echo "HTTP status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "✅ Database Supabase berhasil diakses."
          else
            echo "❌ Supabase mengembalikan error:"
            head -c 1000 response.json
            echo
            exit 1
          fi
