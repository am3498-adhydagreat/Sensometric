name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        shell: bash
        env:
          SUPAWAKE_CONFIG: ${{ secrets.SUPAWAKE_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "${SUPAWAKE_CONFIG:-}" ]; then
            echo "❌ Secret SUPAWAKE_CONFIG kosong atau tidak tersedia."
            exit 1
          fi

          SUPABASE_URL="$(jq -er '
            .projects[0].url
            | select(type == "string" and length > 0)
          ' <<< "$SUPAWAKE_CONFIG")"

          SUPABASE_KEY="$(jq -er '
            .projects[0].publishableKey //
            .projects[0].anonKey
            | select(type == "string" and length > 0)
          ' <<< "$SUPAWAKE_CONFIG")"

          SUPABASE_URL="${SUPABASE_URL%/}"

          echo "Menghubungi Supabase..."

          STATUS="$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            --output response.json \
            --write-out "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/studies?select=id&limit=1")"

          echo "HTTP status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "✅ Database Supabase berhasil diakses."
          else
            echo "❌ Supabase mengembalikan error:"
            head -c 1000 response.json
            echo
            exit 1
          fi
