name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (Direct REST API)
        run: |
          # Ambil URL dan Key langsung dari secret tanpa JSON
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          
          # Cek apakah URL dan Key berhasil diambil
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ Gagal membaca URL atau Key. Pastikan secret 'SUPABASE_URL' dan 'SUPABASE_ANON_KEY' sudah dibuat."
            exit 1
          fi
          
          # Kirim request ke tabel keepalive
          echo "Menghubungi $SUPABASE_URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1")
          
          echo "Status koneksi: $STATUS"
          
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Database Supabase berhasil dijaga tetap aktif!"
          else
            echo "❌ Gagal terhubung (Status $STATUS). Pastikan tabel 'keepalive' sudah dibuat di Supabase."
            exit 1
          fi
