name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    env:
      SUPAWAKE_CONFIG: ${{ secrets.SUPAWAKE_CONFIG }}

    steps:
      - name: Ping Supabase REST API
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPAWAKE_CONFIG:-}" ]; then
            echo "❌ Secret SUPAWAKE_CONFIG tidak ditemukan atau kosong."
            exit 1
          fi

          if ! SUPABASE_URL="$(jq -er '
            .projects[0].url
            | select(type == "string" and length > 0)
          ' <<< "$SUPAWAKE_CONFIG")"; then
            echo "❌ Field projects[0].url tidak valid."
            exit 1
          fi

          if ! SUPABASE_KEY="$(jq -er '
            .projects[0].anonKey
            | select(type == "string" and length > 0)
          ' <<< "$SUPAWAKE_CONFIG")"; then
            echo "❌ Field projects[0].anonKey tidak valid."
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"

          if [[ "$SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "❌ Format Supabase URL tidak valid."
            exit 1
          fi

          HEADERS=(
            -H "apikey: $SUPABASE_KEY"
          )

          # Legacy anon key adalah JWT dan biasanya diawali eyJ
          if [[ "$SUPABASE_KEY" == eyJ* ]]; then
            HEADERS+=(
              -H "Authorization: Bearer $SUPABASE_KEY"
            )
          fi

          echo "Menghubungi Supabase project..."

          STATUS="$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            --output response.json \
            --write-out "%{http_code}" \
            "${HEADERS[@]}" \
            "$SUPABASE_URL/rest/v1/keepalive?select=*&limit=1")"

          echo "HTTP status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "✅ Supabase berhasil diakses."
          else
            echo "❌ Respons Supabase:"
            head -c 1000 response.json
            echo
            exit 1
          fi
